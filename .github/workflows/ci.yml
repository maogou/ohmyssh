# 每次 push 和 PR 都跑一遍 make test 与 make lint 做的事,
# 让"本地能过"和"CI 能过"是同一件事。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支连续推送时取消上一次:旧提交没必要继续占着 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 同一套用例在三个系统上各跑一遍:一套代码在三个平台上走的是不同的实现 ——
    # stdin 的取消在 Linux 上是 epoll、在 macOS 上是 kqueue、在 Windows 上只能
    # 对控制台句柄下手(管道式的 stdin 取消不了,那条用例在那边跳过),窗口大小变
    # 化靠各自的信号,权限位在 Windows 上只剩一个只读属性,路径分隔符也各按各的
    # —— 一个平台上过不了的竞态,在另一个平台上可能根本不出现,只在另一台上试
    # 是发现不了的。
    strategy:
      # 一个平台挂了不取消另一个:"只有 macOS 挂"本身就是最有用的那条信息,
      # 而 fail-fast 正好会把这条信息取消掉。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Go 版本以 go.mod 为准,不在这里再写一遍
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # -race 与 make test 一致:项目里 goroutine 不少(传输进度、SIGWINCH、bubbletea 的 Cmd)。
      # Windows 上 race 需要能用的 C 工具链(windows-latest 镜像自带 MSYS2 的 mingw);
      # 万一那边连测试二进制都启动不了,把这一行的 -race 去掉即可,其余不动。
      - name: Test
        run: go test -race -cover ./...

  lint:
    # 只在 Linux 上跑:静态检查不看操作系统,没必要为此排 macOS runner 的队。
    # (私有仓库的 macOS 分钟数按十倍计,这一条也不便宜。)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # 与 Makefile 的 GOLANGCI_VERSION 钉在同一个版本上:改一处要改两处。
          # golangci-lint 的依赖图会污染主模块,所以两边都不走 go.mod。
          version: v2.13.2
