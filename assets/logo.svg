<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">ohmyssh</title>
  <desc>A terminal prompt whose cursor is a keyhole.</desc>
  <defs>
    <!-- The colours the browser paints itself with: the accent its cursor takes,
         deepened into the bar its selected row takes. -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C4FD8"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <!-- The block cursor, with a keyhole punched through it: what the prompt is
         waiting for is a login. -->
    <mask id="keyhole" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="340" cy="242" r="18" fill="#000"/>
      <path d="M332 254 L348 254 L352 286 L328 286 Z" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- The marker the host list leads every row with, drawn as a prompt. -->
  <path d="M148 138 L248 256 L148 374" fill="none" stroke="#EDE9FE"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The cursor, which is the one thing on screen asking for a keypress. -->
  <rect x="292" y="208" width="96" height="96" rx="22" fill="#fff" mask="url(#keyhole)"/>
</svg>
